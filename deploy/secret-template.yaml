 # =============================================================================
 # Secret templates  (replace <PLACEHOLDER> values, then apply with kubectl)
 # =============================================================================
 ---
 # Redis credentials: used by deploy/deployment-cpu-redis.yaml (queue worker)
 apiVersion: v1
 kind: Secret
 metadata:
   name: redis-credentials
   namespace: mcap-extract
 type: Opaque
 stringData:
   host: "<YOUR_REDIS_HOST>"
   port: "6379"
   username: ""
   password: "<YOUR_REDIS_PASSWORD>"
 ---
 # -------------------------------------------------------------------
 # Optional: OSS credentials (only needed if switching to NO_UPLOAD=0)
 # -------------------------------------------------------------------
