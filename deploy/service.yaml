apiVersion: v1
kind: Service
metadata:
  name: sview-bin-svc
  namespace: mcap-extract
spec:
  type: ClusterIP
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800
  selector:
    app: sview-bin
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
