   APP_DB_HOST: "<HANDVIS_PG_HOST>"
   APP_DB_PORT: "5432"
   APP_DB_USER: "handvis"
   APP_DB_PASSWORD: "<HANDVIS_PG_PASSWORD>"
   APP_DB_NAME: "handvis_dev"
   POSTGRES_HOST: "pgm-uf60971hzojtgi27.pg.rds.aliyuncs.com"
   POSTGRES_PORT: "5432"
   POSTGRES_USER: "ss_data_platform_admin"
   POSTGRES_PASSWORD: "<SCORE_PG_PASSWORD>"
   POSTGRES_DATABASE: "data_platform_prod"
